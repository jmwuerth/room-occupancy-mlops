name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 linter
        run: flake8 src/ tests/ --max-line-length=100

      - name: Execute training pipeline to generate test artifacts
        run: python -m src.train

      - name: Run pytest suite
        run: pytest -v

  build-and-push-containers:
    name: Build & Push Training and Inference Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute training pipeline to bundle artifacts
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate model artifacts for serving container
        run: |
          pip install -r requirements.txt
          python -m src.train

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Training Pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.train
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/occupancy-train:latest

      - name: Build and push Inference Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.serve
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/occupancy-serve:latest
          